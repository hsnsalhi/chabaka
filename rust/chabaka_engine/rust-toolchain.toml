# Épingle la toolchain pour reproductibilité CI (R1 spec §10)
[toolchain]
channel = "stable"
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "aarch64-apple-darwin",
]
