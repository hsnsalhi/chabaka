<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Amiri'; src: url('../../assets/fonts/Amiri-Bold.ttf'); font-weight: 700; }
html,body{margin:0;padding:0;background:transparent}
.icon{position:relative;width:1024px;height:1024px;overflow:hidden;
  background:radial-gradient(circle at 30% 25%, #9E3333 0%, #7A1D1D 55%, #5A1010 100%);}
.icon.transparent{background:transparent}
.grid{position:absolute;inset:0;opacity:.13;
  background-image:linear-gradient(#F5E6D3 3px, transparent 3px),linear-gradient(90deg,#F5E6D3 3px, transparent 3px);
  background-size:128px 128px;background-position:64px 64px}
.arrow{position:absolute;color:#D4AF37;font-family:Amiri;font-weight:700;opacity:.9}
.letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Amiri';font-weight:700;font-size:640px;line-height:1;color:#F5E6D3;
  text-shadow:0 18px 40px rgba(0,0,0,.35)}
.letter span{position:relative;top:-40px}
.cell{position:absolute;width:150px;height:150px;border:6px solid rgba(245,230,211,.55);border-radius:14px}
</style></head>
<body>
<div id="icon" class="icon">
  <div class="grid"></div>
  <div class="cell" style="left:96px;top:96px;background:rgba(212,175,55,.85);border-color:#D4AF37"></div>
  <div class="arrow" style="left:118px;top:96px;font-size:120px;color:#5A1010">←</div>
  <div class="cell" style="left:778px;top:778px"></div>
  <div class="letter"><span>ش</span></div>
</div>
</body></html>
