<!doctype html>
<html dir="rtl"><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Amiri'; src: url('../../assets/fonts/Amiri-Bold.ttf'); font-weight: 700; }
@font-face { font-family: 'Cairo'; src: url('../../assets/fonts/Cairo-SemiBold.ttf'); font-weight: 600; }
html,body{margin:0;padding:0;background:transparent}
.feat{position:relative;width:1024px;height:500px;overflow:hidden;
  background:radial-gradient(circle at 75% 30%, #9E3333 0%, #7A1D1D 55%, #5A1010 100%);}
.grid{position:absolute;inset:0;opacity:.12;
  background-image:linear-gradient(#F5E6D3 2px, transparent 2px),linear-gradient(90deg,#F5E6D3 2px, transparent 2px);
  background-size:100px 100px;background-position:50px 50px}
.icon{position:absolute;left:72px;top:90px;width:320px;height:320px;border-radius:72px;
  background:radial-gradient(circle at 30% 25%, #9E3333 0%, #7A1D1D 55%, #5A1010 100%);
  box-shadow:0 24px 60px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
  border:3px solid rgba(245,230,211,.25)}
.icon .l{font-family:Amiri;font-weight:700;font-size:210px;line-height:1;color:#F5E6D3;position:relative;top:-14px;
  text-shadow:0 10px 24px rgba(0,0,0,.35)}
.icon .cell{position:absolute;left:28px;top:28px;width:50px;height:50px;border-radius:8px;background:rgba(212,175,55,.9)}
.text{position:absolute;right:80px;top:96px;width:520px;text-align:right;color:#F5E6D3}
.title{font-family:Amiri;font-weight:700;font-size:150px;line-height:1;margin:0;text-shadow:0 10px 30px rgba(0,0,0,.35)}
.sub{font-family:Cairo;font-weight:600;font-size:44px;line-height:1.4;margin:18px 0 0;color:#F5E6D3;opacity:.95}
.tag{font-family:Cairo;font-weight:600;font-size:28px;margin:14px 0 0;color:#D4AF37}
</style></head>
<body>
<div id="feat" class="feat">
  <div class="grid"></div>
  <div class="icon"><div class="cell"></div><div class="l">ش</div></div>
  <div class="text">
    <p class="title">شبكة</p>
    <p class="sub">كلمات مسهمة عربية</p>
    <p class="tag">شبكة جديدة كل يوم · بدون إنترنت</p>
  </div>
</div>
</body></html>
