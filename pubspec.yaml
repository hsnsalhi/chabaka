name: chabaka
description: "Mots fléchés en arabe (مسهمة) inspirés des grilles d'Abou Salma"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Persistance locale
  hive_flutter: ^1.1.0

  # Knowledge Base SQLite (R4)
  sqflite: ^2.4.1
  path: ^1.9.0

  # Navigation
  go_router: ^14.6.3

  # Icons
  cupertino_icons: ^1.0.8

  # Audio
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # SQLite FFI pour tests unitaires (lecture KB sans device)
  sqflite_common_ffi: ^2.3.4
  # Génération de code Hive (si on utilise les adapters générés — optionnel pour MVP)
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/wordlist/
    - assets/kb/
    - assets/sounds/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
