name: iOS → TestFlight

# Compile l'app iOS sur un runner macOS, la signe avec le certificat de
# distribution et le profil stockés en secrets, puis l'envoie sur TestFlight.
# Lancement manuel (onglet Actions → ce workflow → Run workflow).
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   IOS_P12_BASE64        certificat Apple Distribution + clé privée (.p12) en base64
#   IOS_P12_PASSWORD      mot de passe du .p12
#   IOS_PROFILE_BASE64    profil de provisionnement App Store (.mobileprovision) en base64
#   IOS_PROFILE_NAME      nom du profil tel que créé sur developer.apple.com
#   APPLE_TEAM_ID         identifiant d'équipe (10 caractères)
#   ASC_KEY_ID            App Store Connect API : Key ID
#   ASC_ISSUER_ID         App Store Connect API : Issuer ID
#   ASC_API_KEY_BASE64    App Store Connect API : fichier .p8 en base64

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Numéro de build (doit augmenter à chaque envoi)
        required: true
        default: "1"

jobs:
  build-upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Apple exige le SDK iOS 26 (Xcode 26+) pour tout envoi App Store Connect.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Certificat et profil de provisionnement
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/chabaka.mobileprovision
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Options d'export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          sed -e "s/__TEAM_ID__/$APPLE_TEAM_ID/" -e "s/__PROFILE_NAME__/$IOS_PROFILE_NAME/" \
            ios/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Dépendances
        run: |
          flutter pub get
          cd ios && pod install

      - name: Build IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          flutter build ipa --release \
            --build-number "${{ inputs.build_number }}" \
            --export-options-plist "$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define=CI=true
          ls -la build/ios/ipa/

      - name: Upload TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chabaka-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
