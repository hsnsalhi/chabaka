name: Android → Play Store

# Compile l'App Bundle Android (AAB) signé avec la clé d'upload Google Play,
# plus un APK universel pour les tests directs, et les dépose en artefacts
# du run. Le fichier .aab s'envoie ensuite dans Play Console (ou, plus tard,
# automatiquement via un compte de service).
# Lancement manuel (onglet Actions → ce workflow → Run workflow).
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   ANDROID_KEYSTORE_BASE64    keystore d'upload (.jks) en base64
#   ANDROID_KEYSTORE_PASSWORD  mot de passe du keystore
#   ANDROID_KEY_ALIAS          alias de la clé (upload)
#   ANDROID_KEY_PASSWORD       mot de passe de la clé
# Sans ces secrets, le build se fait quand même, signé en debug (non publiable),
# ce qui permet de valider la chaîne de compilation.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: versionCode (doit augmenter à chaque envoi sur Play)
        required: true
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Clé d'upload
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Clé d'upload présente."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent : build signé en debug, non publiable."
          fi

      - name: Dépendances
        run: flutter pub get

      - name: Build App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-number "${{ inputs.build_number }}" \
            --dart-define=CI=true
          ls -la build/app/outputs/bundle/release/

      - name: Build APK universel (tests directs)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-number "${{ inputs.build_number }}" \
            --dart-define=CI=true
          ls -la build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: chabaka-android-${{ inputs.build_number }}
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
