name: Site public (GitHub Pages)

# Hébergement historique du site. Depuis la migration sur Firebase Hosting
# (techlyb.com), ce workflow ne se lance plus automatiquement : l'environnement
# « github-pages » refuse les déploiements depuis main et chaque push produisait
# un échec (et un e-mail). Lancement manuel uniquement, si besoin.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
